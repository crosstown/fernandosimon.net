name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug -- print OIDC token claims (temporary)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # pad base64url for decoding, then show only non-sensitive claims
          MOD=$(( ${#PAYLOAD} % 4 ))
          if [ $MOD -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
          if [ $MOD -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, iss, repository, ref, environment, job_workflow_ref}'

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::654654435055:role/github-actions-fernandosimon-net-deploy
          aws-region: us-east-1

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://fernandosimon-net-site \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --exclude ".gitignore" \
            --delete \
            --cache-control "public, max-age=300"
          # aws s3 sync auto-detects content-type per file (text/html, text/css,
          # etc.) -- do not force a single --content-type here, it would mislabel
          # any non-HTML asset added later.

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E37GENGKPB4123 \
            --paths "/*"
